<!DOCTYPE html>
<html lang="ar" id="htmlTag">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pharaoh Photo</title>

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Cairo', sans-serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    position:relative;
}

/* الخلفية المتحركة */
.bg-animation{
    position:absolute;
    width:100%;
    height:100%;

    background:
    linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)),
    url('https://images.unsplash.com/photo-1516035069371-29a1b244cc32?q=80&w=1920&auto=format&fit=crop');

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    animation:moveBg 20s infinite alternate ease-in-out;

    z-index:-2;
}

@keyframes moveBg{

    0%{
        transform:scale(1) translateX(0);
    }

    50%{
        transform:scale(1.1) translateX(-20px);
    }

    100%{
        transform:scale(1.15) translateX(20px);
    }

}

.overlay{
    position:absolute;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.3);
    backdrop-filter:blur(2px);
    z-index:-1;
}

/* الكارت */
.card{
    width:360px;
    max-width:90%;
    padding:35px;
    border-radius:30px;
    text-align:center;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.15);
    box-shadow:0 10px 40px rgba(0,0,0,0.5);
    color:white;
    animation:fadeUp 1.2s ease;
    user-select:none;
}

/* صورة البروفايل */
.profile-img{
    width:150px;
    height:150px;
    object-fit:cover;
    border-radius:50%;
    border:4px solid white;
    margin-bottom:20px;
    box-shadow:0 0 20px rgba(255,255,255,0.4);
}

/* الاسم */
h1{
    font-family:'Cinzel', serif;
    font-size:36px;
    margin-bottom:10px;
    letter-spacing:2px;
    animation:glow 3s infinite alternate;
}

@keyframes glow{

    from{
        text-shadow:0 0 10px rgba(255,255,255,0.4);
    }

    to{
        text-shadow:
        0 0 20px rgba(255,255,255,0.9),
        0 0 40px rgba(255,255,255,0.5);
    }

}

/* الوصف */
p{
    color:#ddd;
    margin-bottom:30px;
    font-size:17px;
}

/* روابط السوشيال */
.social-links a{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    text-decoration:none;
    color:white;
    padding:15px;
    margin:14px 0;
    border-radius:18px;
    font-size:18px;
    font-weight:bold;
    transition:0.35s;
}

/* الألوان */

.whatsapp{
    background:linear-gradient(45deg,#25D366,#1ebe57);
}

.website{
    background:linear-gradient(45deg,#6a11cb,#2575fc);
    color:white;
}

.instagram{
    background:linear-gradient(45deg,#833AB4,#E1306C,#F77737);
}

.snapchat{
    background:#FFFC00;
    color:black !important;
}

.facebook{
    background:linear-gradient(45deg,#1877F2,#0d5fd3);
}

.tiktok{
    background:linear-gradient(45deg,#000000,#222222);
    color:white;
}

/* Location */
.location{
    background:linear-gradient(45deg,#ff512f,#dd2476);
    color:white;
}

/* Hover */
.social-links a:hover{
    transform:translateY(-4px) scale(1.03);
    box-shadow:0 8px 20px rgba(0,0,0,0.35);
}

/* الأيقونات */
.social-links i{
    font-size:22px;
}

/* التوقيع */
.footer{
    margin-top:25px;
    font-size:14px;
    color:#ccc;
    opacity:0.8;
}

.footer a{
    color:#0385f0;
    text-decoration:none;
    font-weight:normal;
}

.footer a:hover{
    text-decoration:underline;
}

/* ظهور الكارت */
@keyframes fadeUp{

    from{
        opacity:0;
        transform:translateY(40px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

/* موبايل */
@media(max-width:480px){

    .card{
        padding:25px;
    }

    h1{
        font-size:30px;
    }

    .social-links a{
        font-size:16px;
        padding:13px;
    }

}

</style>
</head>

<body>

<!-- الخلفية -->
<div class="bg-animation"></div>

<!-- طبقة -->

<div class="card">

    <!-- صورة البروفايل -->

    <!-- السوشيال -->

</div>

<script>

/* تغيير اللغة تلقائي حسب لغة الجهاز */

window.onload = function () {

    const userLang = navigator.language || navigator.userLanguage;

    const title = document.getElementById("title");
    const desc = document.getElementById("description");
    const htmlTag = document.getElementById("htmlTag");

    if(userLang.startsWith("ar")){

        title.innerHTML = "فرعون فوتو";

        desc.innerHTML = "تصوير فوتوغرافي وفيديو";

        htmlTag.lang = "ar";
        htmlTag.dir = "rtl";

    }

    else{

        title.innerHTML = "Pharaoh Photo";

        desc.innerHTML = "Photography & Videography";

        htmlTag.lang = "en";
        htmlTag.dir = "ltr";

    }

}

</script>

</body>
</html>


دلوقتي ترتيب الأزرار:
